<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Maziyar — Build, Learn, Create</title>
  <desc id="desc">A dark violet abstract banner with glowing flowing waves and the words Maziyar, curious mind, creative spirit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080914"/>
      <stop offset=".52" stop-color="#100d25"/>
      <stop offset="1" stop-color="#050817"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset=".48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".45" stop-color="#a78bfa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6d28d9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8b5cf6" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)" opacity=".62"/>
  <ellipse cx="250" cy="85" rx="420" ry="260" fill="url(#glow)"/>
  <ellipse cx="1110" cy="285" rx="390" ry="250" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-80 270 C180 40 340 410 620 200 S1010 30 1360 170" stroke="#6d28d9" stroke-opacity=".25" stroke-width="42" filter="url(#blur)"/>
    <path d="M-80 270 C180 40 340 410 620 200 S1010 30 1360 170" stroke="url(#violet)" stroke-opacity=".42" stroke-width="2"/>
    <path d="M-90 295 C170 75 355 390 630 230 S1040 65 1370 195" stroke="url(#line)" stroke-width="1.2">
      <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-70 245 C180 10 355 360 630 175 S1030 0 1360 145" stroke="#38bdf8" stroke-opacity=".16" stroke-width="1.2" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" from="0" to="240" dur="22s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#c4b5fd">
    <circle cx="168" cy="92" r="2" opacity=".9"><animate attributeName="opacity" values=".25;1;.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="90" r="2.5" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="275" r="1.8" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="282" r="1.6" opacity=".65"><animate attributeName="opacity" values=".2;.8;.2" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="640" y="155" font-size="16" font-weight="600" letter-spacing="7" fill="#a78bfa">PERSONAL PROFILE</text>
    <text x="640" y="226" font-size="66" font-weight="800" letter-spacing="7" fill="#f8fafc">MAZIYAR</text>
    <rect x="506" y="250" width="268" height="2" rx="1" fill="url(#violet)"/>
    <text x="640" y="292" font-size="17" font-weight="500" letter-spacing="4" fill="#cbd5e1">BUILD  ·  LEARN  ·  CREATE</text>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="17" fill="none" stroke="#a78bfa" stroke-opacity=".24"/>
</svg>
