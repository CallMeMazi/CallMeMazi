<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54" role="img" aria-label="Backend developer">
  <rect width="900" height="54" rx="8" fill="#0C0E14"/>
  <g fill="#F4F1EA" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22">
    <text x="450" y="34" text-anchor="middle" opacity="0">Backend developer, working in C# and Python
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.28;0.36" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="34" text-anchor="middle" opacity="0">APIs, SQL Server, and a use case you can follow
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.41;0.61;0.69" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="34" text-anchor="middle" opacity="0">Three years of building server-side software
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.74;0.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
